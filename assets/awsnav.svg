<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- awsnav icon: a resource list with one row selected, and a prompt to navigate it -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f33"/>
      <stop offset="1" stop-color="#16181a"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#bg)"/>
  <!-- breadcrumb bar -->
  <rect x="20" y="22" width="18" height="6" rx="3" fill="#7f848e"/>
  <rect x="44" y="22" width="22" height="6" rx="3" fill="#7f848e" opacity="0.7"/>
  <rect x="72" y="22" width="14" height="6" rx="3" fill="#7f848e" opacity="0.45"/>
  <!-- rows -->
  <rect x="20" y="38" width="88" height="8" rx="2.5" fill="#3a3f45"/>
  <rect x="16" y="51" width="96" height="12" rx="3" fill="#61afef"/>
  <rect x="24" y="55" width="30" height="4" rx="2" fill="#16181a" opacity="0.75"/>
  <rect x="60" y="55" width="22" height="4" rx="2" fill="#16181a" opacity="0.55"/>
  <rect x="20" y="68" width="88" height="8" rx="2.5" fill="#3a3f45"/>
  <!-- prompt -->
  <path d="M22 88 L36 98 L22 108" fill="none" stroke="#e5c07b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="101" width="26" height="8" rx="2" fill="#c5c8c6">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
